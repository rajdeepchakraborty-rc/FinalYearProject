apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalstream-api
  namespace: signalstream
  labels:
    app: signalstream-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signalstream-api
  template:
    metadata:
      labels:
        app: signalstream-api
    spec:
      containers:
        - name: api
          image: signalstream-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: signalstream-config
            - secretRef:
                name: signalstream-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
