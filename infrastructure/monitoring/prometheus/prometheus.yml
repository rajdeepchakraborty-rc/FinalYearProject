# =============================================================
# SignalStream — Prometheus Configuration
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── SignalStream API Server ──
  - job_name: "signalstream-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"
          env: "development"

  # ── SignalStream ML Inference Server ──
  - job_name: "signalstream-inference"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inference:8100"]
        labels:
          service: "inference"
          env: "development"

  # ── SignalStream MCP Tool Server ──
  - job_name: "signalstream-mcp"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["mcp-server:8200"]
        labels:
          service: "mcp-server"
          env: "development"
