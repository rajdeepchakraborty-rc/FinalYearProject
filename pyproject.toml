[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalstream"
version = "1.0.0"
description = "AI-Powered Dynamic Customer Feedback & Brand Crisis Intelligence Platform"
requires-python = ">=3.12"

dependencies = [
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Redis
    "redis[hiredis]>=5.1.0",

    # Kafka
    "aiokafka>=0.11.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",

    # AI/ML
    "transformers>=4.45.0",
    "torch>=2.4.0",
    "sentence-transformers>=3.1.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",

    # LLM
    "openai>=1.50.0",
    "anthropic>=0.34.0",

    # CrewAI
    "crewai>=0.80.0",

    # Data Processing
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Object Storage
    "boto3>=1.35.0",

    # Observability
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "structlog>=24.4.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.25.0",
    "testcontainers[postgres,kafka,redis]>=4.8.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "locust>=2.31.0",
    "playwright>=1.47.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
